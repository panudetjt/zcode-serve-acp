# bun runner config (mise.toml = task SSOT — thamrules mise-single-source)
#
# coverageSkipTestFiles: test files are not shipped code — only src/ is gated.
#
# coverageThreshold (bun 1.4.4, probe-verified 20 Nov 2026): the number applies
# per file to BOTH funcs and lines, so the binding constraint is the worst
# file×metric — not the "All files" row. 1.0 is not special-cased: it fails
# like any value above the worst file. Today the worst is session.ts funcs
# 92.31%, so 0.92 passes and 0.93 fails; lines are 100% on every src file.
# Re-measure after a bun upgrade — the gate rides the worst file.
[test]
coverageSkipTestFiles = true
coverageThreshold = 0.92

# bun fmt — mirrors the Effect monorepo's dprint.json (read-only reference
# clone in .repos/effect): indentWidth 2, lineWidth 120, newLineKind lf;
# typescript: semiColons asi, quoteStyle alwaysDouble, trailingCommas never,
# arrowFunction.useParentheses force. dprint's operatorPosition "maintain"
# has no prettier-side equivalent — bun fmt keeps its default placement.
[fmt]
printWidth = 120
tabWidth = 2
semi = false
singleQuote = false
trailingComma = "none"
arrowParens = "always"
endOfLine = "lf"
# captured daemon fixtures must stay byte-stable (AGENTS.md: never hand-edit);
# .repos/ is gitignored (default ignore) but listed for clarity
ignorePatterns = [".repos/", "test/fixtures/"]
