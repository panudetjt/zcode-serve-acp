# zcode-serve-acp — task SSOT (thamrules mise-single-source)
[tools]
bun = "1.4.4"

[tasks.test]
description = "Unit tests with coverage (wire codec, translator parity, golden replay, interactions, models, daemon, jsonrpc, acp-server)"
run = "bun test --coverage ./test"

[tasks.check]
description = "Typecheck TypeScript with bun check"
run = "bun check"

[tasks.compile]
description = "Single-binary build → dist/zcode-serve-acp (OUTFILE overrides the target)"
run = "bun build --compile --target=bun-linux-x64 --outfile \"${OUTFILE:-dist/zcode-serve-acp}\" src/bin.ts"

[tasks.smoke]
description = "ACP handshake + session/new (models) + short prompt against the real daemon"
run = "bun scripts/smoke.mjs"

[tasks.fmt]
description = "Format with oxfmt (writes in place)"
run = "bun x oxfmt -c .oxfmtrc.ts"

[tasks.fmt-check]
description = "Check formatting without writing"
run = "bun x oxfmt -c .oxfmtrc.ts --check"

[tasks.lint]
description = "Lint with oxlint (scoped: reference clone .repos/ carries its own config; excluded from lint)"
run = "bun x oxlint src test scripts"

[tasks.ci]
description = "check + test + fmt-check + lint + compile + smoke"
depends = ["check", "test", "fmt-check", "lint", "compile", "smoke"]
