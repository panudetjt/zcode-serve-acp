# zcode-serve-acp — task SSOT (thamrules mise-single-source)
[tools]
bun = "1.4.4"

[tasks.test]
description = "Unit tests (wire codec, translator parity, golden replay, interactions, models)"
run = "bun test ./test"

[tasks.compile]
description = "Single-binary build → dist/zcode-serve-acp"
run = "bun build --compile --target=bun-linux-x64 --outfile dist/zcode-serve-acp src/bin.ts"

[tasks.smoke]
description = "ACP handshake + session/new (models) + short prompt against the real daemon"
run = "bun scripts/smoke.mjs"

[tasks.fmt]
description = "Format with oxfmt (writes in place)"
run = "bun x oxfmt"

[tasks.fmt-check]
description = "Check formatting without writing"
run = "bun x oxfmt --check"

[tasks.lint]
description = "Lint with oxlint (scoped: vendored repos/ carries its own oxlint config)"
run = "bun x oxlint src test scripts"

[tasks.ci]
description = "test + compile + smoke"
depends = ["test", "compile", "smoke"]
